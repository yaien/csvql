<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSVQL</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="container-fluid" x-data="app">
    <template x-if="ready">
        <main>
            <header>
                <nav>
                    <ul>
                        <strong>CSVQL</strong>
                    </ul>
                    <ul>
                        <li><button @click="open = true">Schema</button></li>
                    </ul>
                </nav>
            </header>

            <dialog :open="open" @blur="open = false" @keydown.escape="open = false">
                <article>
                    <header>
                        <button aria-label="Close" rel="prev" @click="open = false"></button>
                        <p><strong>Schema</strong></p>
                    </header>
                    <template x-for="schema in schemas" :key="schema.name">
                        <details :name="schema.name" open>
                            <summary role="button" x-text="schema.name"></summary>
                            <table>
                                <tbody>
                                    <template x-for="(column, index) in schema.columns" :key="index">
                                        <tr>
                                            <td x-text="column.name"></td>
                                            <td x-text="column.type"></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </details>
                    </template>

                </article>
            </dialog>



            <section>
                <section class="query-section">
                    <form @submit.prevent="execute()">
                        <fieldset role="group">
                            <input x-model="query" placeholder="e.g., SELECT * FROM data WHERE column1 = 'value';"
                                @keyup.enter="execute()" />
                            <input type="submit" value="Run" />
                        </fieldset>
                    </form>
                </section>

                <template x-if="loading">
                    <article aria-busy="true"></article>
                </template>

                <template x-if="error">
                    <p class="error" x-text="error"></p>
                </template>

                <template x-if="result && !loading">
                    <section class="results-section">
                        <h2>Query Results</h2>
                        <div>
                            <span x-text="result.meta.rowCount"></span> rows found in
                            <span x-text="result.meta.duration"></span>
                        </div>
                        <div class="overflow-auto">
                            <table x-data="result.data">
                                <thead>
                                    <tr>
                                        <template x-for="(column, index) in columns" :key="index">
                                            <th x-text="column"></th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="(row, rindex) in rows" :key="rindex">
                                        <tr>
                                            <template x-for="(column, cindex) in columns" :key="cindex">
                                                <td x-text="row[cindex]"></td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        <template x-if="!loading && result.data.rows.length === 0 && !error">
                            <p>No results found.</p>
                        </template>
                    </section>
                </template>
            </section>
            <template x-if="!ready">
                <main class="container">
                    <article aria-busy="true"></article>
                </main>
            </template>
        </main>
    </template>
    <template x-if="!ready">
        <article aria-busy="true"></article>
    </template>
</body>

</html>
